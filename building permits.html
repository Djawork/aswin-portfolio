<!doctype html>

<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- Clean Vertical Feed Styles -->
  <style>
    .accordion {
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      height: auto !important;
    }

    .panel {
      position: relative !important;
      width: 100% !important;
      height: 100vh !important;
      flex: none !important;
      flex-basis: auto !important;
      margin-bottom: 20px !important;
      display: block !important;
      background: transparent !important;
    }

    /* Make background image wrappers and shades completely transparent */
    .panel-image,
    .panel-shade {
      background: transparent !important;
      background-image: none !important;
      opacity: 0 !important;
      display: none !important;
    }

    /* Force the panel's internal wrappers and content boxes to be completely transparent */
    .panel > div, 
    .panel-content {
      background: transparent !important;
      background-color: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* Completely remove the background box for text content on ALL slides */
    .panel-content {
      position: absolute !important;
      top: 25px !important;
      left: 60px !important;
      bottom: 25px !important;
      right: auto !important;
      transform: none !important;
      text-align: left !important;
      max-width: 720px !important;
      opacity: 1 !important;
      visibility: visible !important;
      padding: 0 !important;
    }

    .panel-kicker {
      font-size: 2.2rem !important;
      letter-spacing: 2px !important;
      color: #888 !important;
      text-transform: uppercase !important;
      margin-bottom: 8px !important;
    }

    .panel-content h2 {
      font-size: 3.5rem !important;
      line-height: 1.1 !important;
      margin-bottom: 8px !important;
      color: #fff !important;
    }

    .slide-meta {
      font-size: 0.95rem !important;
      letter-spacing: 1.5px !important;
      color: #aaa !important;
      text-transform: uppercase !important;
      margin-bottom: 12px !important;
      display: block !important;
    }

    /* CONTROL IMAGE SIZE HERE: Change max-width to make the image bigger or smaller */
    .panel-content img {
      width: 100% !important;
      max-width: 3000px !important; 
      height: auto !important;
      border-radius: 8px !important;
      display: block !important;
    }
  </style>
</head>
