<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Building Permits Collection — Aswin Biju">
  <title>Building Permits — Aswin Biju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- Clean Vertical Feed with 2-Column Split Slides -->
  <style>
    .accordion {
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      height: auto !important;
    }

    .panel {
      position: relative !important;
      width: 100% !important;
      min-height: 100vh !important;
      height: auto !important;
      flex: none !important;
      flex-basis: auto !important;
      margin-bottom: 40px !important;
      display: block !important;
      background: transparent !important;
      padding: 40px 60px !important;
      border-bottom: 1px solid #1f1f1f !important;
    }

    /* Hide accordion background image wrappers and shades */
    .panel-image,
    .panel-shade {
      background: transparent !important;
      background-image: none !important;
      opacity: 0 !important;
      display: none !important;
    }

    /* Two-column vertical split inside each slide */
    .split-slide {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 48px !important;
      width: 100% !important;
      align-items: start !important;
    }

    .split-col {
      background: transparent !important;
      background-color: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      text-align: left !important;
    }

    .split-col + .split-col {
      border-left: 1px solid #1f1f1f !important;
      padding-left: 48px !important;
    }

    .panel-kicker {
      font-size: 2rem !important;
      letter-spacing: 2px !important;
      color: #888 !important;
      text-transform: uppercase !important;
      margin-bottom: 8px !important;
    }

    .split-col h2 {
      font-size: 2.8rem !important;
      line-height: 1.12 !important;
      margin-bottom: 8px !important;
      color: #fff !important;
    }

    .slide-meta {
      font-size: 0.9rem !important;
      letter-spacing: 1.5px !important;
      color: #aaa !important;
      text-transform: uppercase !important;
      margin-bottom: 16px !important;
      display: block !important;
    }

    .split-col img {
      width: 100% !important;
      height: auto !important;
      border-radius: 8px !important;
      display: block !important;
      margin-top: 12px !important;
    }

    @media (max-width: 900px) {
      .panel {
        padding: 32px 24px !important;
      }
      .split-slide {
        grid-template-columns: 1fr !important;
        gap: 36px !important;
      }
      .split-col + .split-col {
        border-left: none !important;
        border-top: 1px solid #1f1f1f !important;
        padding-left: 0 !important;
        padding-top: 36px !important;
      }
    }
  </style>
</head>
