<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>About Me — Aswin Biju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Manrope', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Top Minimal Nav matching index.html */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0.92), transparent);
    }

    .top-bar a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .top-bar a:hover {
      opacity: 1;
    }

    /* 1. Full-Screen Signature Fade-In Hero */
    .signature-hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .signature-img {
      max-width: 400px;
      width: 70%;
      height: auto;
      opacity: 0;
      transform: translateY(14px);
      animation: signatureFadeIn 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .signature-fallback {
      display: none;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      animation: signatureFadeIn 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes signatureFadeIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll-cue {
      position: absolute;
      bottom: 36px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888888;
      text-decoration: none;
      opacity: 0;
      animation: fadeCue 1s ease 0.8s forwards;
    }

    @keyframes fadeCue {
      to { opacity: 1; }
    }

    /* Shared Section & Eyebrow Styling */
    .content-section {
      padding: 110px 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
