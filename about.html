<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>About Me — Aswin Biju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Manrope', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Top Minimal Nav matching index.html */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0.92), transparent);
    }

    .top-bar a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .top-bar a:hover {
      opacity: 1;
    }

    /* 1. Full-Screen Signature Fade-In Hero */
    .signature-hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .signature-img {
      max-width: 400px;
      width: 70%;
      height: auto;
      opacity: 0;
      transform: translateY(14px);
      animation: signatureFadeIn 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes signatureFadeIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll-cue {
      position: absolute;
      bottom: 36px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888888;
      text-decoration: none;
      opacity: 0;
      animation: fadeCue 1.5s ease 1.8s forwards;
    }

    @keyframes fadeCue {
      to { opacity: 1; }
    }

    /* Shared Section & Eyebrow Styling */
    .content-section {
      padding: 110px 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 24px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background-color: #666666;
    }

    /* 2. Intro & Bio Section */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 64px;
      align-items: start;
    }

    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-top: 8px;
    }

    .profile-photo-wrap {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid #262626;
      flex-shrink: 0;
      text-decoration: none;
    }

    .profile-img {
      width: 250px;
      height: 315px;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.45s ease;
    }

    /* Dark Gray Overlay + Centered WhatsApp Icon */
    .profile-photo-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(20, 20, 20, 0.62);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .profile-photo-overlay svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      transform: scale(0.88);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fade In on Hover, Fade Out on Mouse Exit */
    .profile-photo-wrap:hover .profile-img {
      transform: scale(1.04);
      filter: grayscale(100%);
    }

    .profile-photo-wrap:hover .profile-photo-overlay {
      opacity: 1;
    }

    .profile-photo-wrap:hover .profile-photo-overlay svg {
      transform: scale(1);
    }

    .about-heading {
      font-size: clamp(2.6rem, 4.5vw, 4.2rem);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .role-subtitle {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9a9a9a;
      line-height: 1.7;
      margin-bottom: 0;
    }

    .linkedin-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 8px 14px;
      border: 1px solid #262626;
      background-color: #0a0a0a;
      color: #d4d4d4;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: border-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }

    .linkedin-link:hover {
      border-color: #ffffff;
      color: #ffffff;
      background-color: #121212;
    }

    .linkedin-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .about-copy p {
      font-size: 16px;
      line-height: 1.8;
      color: #c8c8c8;
      margin-bottom: 22px;
    }

    .about-copy p:last-child {
      margin-bottom: 0;
    }

    /* 3. Design Philosophy Section */
    .philosophy-quote {
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.45;
      color: #ffffff;
      margin-bottom: 28px;
      padding-left: 24px;
      border-left: 2px solid #555555;
    }

    /* 4. Areas of Expertise Grid */
    .expertise-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 36px;
      list-style: none;
      margin-top: 12px;
    }

    .expertise-list li {
      font-size: 15px;
      color: #e0e0e0;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .expertise-list li::before {
      content: "—";
      color: #666666;
      font-size: 12px;
    }

    /* 5. Professional Services Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      margin-top: 12px;
    }

    .service-card {
      padding: 36px;
      border: 1px solid #1f1f1f;
      background-color: #090909;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.45s ease;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: #3a3a3a;
    }

    .service-num {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #7a7a7a;
      margin-bottom: 14px;
      display: block;
    }

    .service-card h3 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .service-card p {
      font-size: 15px;
      line-height: 1.75;
      color: #bdbdbd;
    }

    /* 6. Design Approach & Professional Vision */
    .two-col-blocks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
    }

    .block-item p {
      font-size: 16px;
      line-height: 1.8;
      color: #c8c8c8;
      margin-bottom: 20px;
    }

    /* 7. CTA & Exact Same Footer as index.html */
    .cta-section {
      padding: 110px 6% 90px;
      border-bottom: 1px solid #1f1f1f;
    }

    .cta-inner h2 {
      font-size: clamp(2rem, 3.8vw, 3.4rem);
      font-weight: 400;
      margin-bottom: 28px;
    }

    .cta-link {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      padding-bottom: 6px;
      border-bottom: 1px solid #555555;
      transition: border-color 0.3s ease;
    }

    .cta-link:hover {
      border-color: #ffffff;
    }

    footer {
      padding: 32px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7a7a7a;
    }

    footer a {
      color: #ffffff;
      text-decoration: none;
    }

    /* Architectural Scroll-Reveal Animations */
    .reveal {
      opacity: 0;
      transform: translateY(36px);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 { transition-delay: 0.12s; }
    .reveal-delay-2 { transition-delay: 0.24s; }

    @media (max-width: 960px) {
      .expertise-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 820px) {
      .about-grid,
      .services-grid,
      .two-col-blocks,
      .expertise-list {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      footer {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
    }

    @media (max-width: 540px) {
      .profile-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
