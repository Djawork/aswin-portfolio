<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>About Me — Aswin Biju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Manrope', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Top Minimal Nav matching index.html */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0.92), transparent);
    }

    .top-bar a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .top-bar a:hover {
      opacity: 1;
    }

    /* 1. Full-Screen Signature Fade-In Hero (Slower 4s animation) */
    .signature-hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .signature-img {
      max-width: 400px;
      width: 70%;
      height: auto;
      opacity: 0;
      transform: translateY(14px);
      animation: signatureFadeIn 4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes signatureFadeIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll-cue {
      position: absolute;
      bottom: 36px;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888888;
      text-decoration: none;
      opacity: 0;
      animation: fadeCue 1.5s ease 2.6s forwards;
    }

    @keyframes fadeCue {
      to { opacity: 1; }
    }

    /* Shared Section & Eyebrow Styling */
    .content-section {
      padding: 110px 6%;
      border-bottom: 1px solid #1f1f1f;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9a9a9a;
      margin-bottom: 24px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background-color: #666666;
    }

    /* 2. Intro & Bio Section */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 64px;
      align-items: start;
    }

    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-top: 8px;
    }

    .profile-photo-wrap {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid #262626;
      flex-shrink: 0;
      text-decoration: none;
    }

    .profile-img {
      width: 250px;
      height: 315px;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                  filter 0.45s ease;
    }

    /* Dark Gray Overlay + Centered WhatsApp Icon */
    .profile-photo-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(20, 20, 20, 0.62);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .profile-photo-overlay svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      transform: scale(0.88);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fade In on Hover, Fade Out on Mouse Exit */
    .profile-photo-wrap:hover .profile-img {
      transform: scale(1.04);
      filter: grayscale(100%);
    }

    .profile-photo-wrap:hover .profile-photo-overlay {
      opacity: 1;
    }

    .profile-photo-wrap:hover .profile-photo-overlay svg {
      transform: scale(1);
    }

    .about-heading {
      font-size: clamp(2.6rem, 4.5vw, 4.2rem);
      font-weight: 500;
      line-height: 0.92;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .role-subtitle {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9a9a9a;
      line-height: 1.7;
      margin-bottom: 0;
    }

    .linkedin-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 8px 14px;
      border: 1px solid #262626;
      background-color: #0a0a0a;
      color: #d4d4d4;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: border-color 0.3s ease, color 0.3s
